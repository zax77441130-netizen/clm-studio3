<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Portfolio Detail</title><link rel="stylesheet" href="/assets/styles.css"></head><body class="inner-page"><div id="detail"></div><script src="/assets/shared.js"></script><script>function guessVideoType(url){const value=String(url||'').toLowerCase().split('?')[0].split('#')[0];if(value.endsWith('.mp4'))return 'video/mp4';if(value.endsWith('.webm'))return 'video/webm';if(value.endsWith('.mov'))return 'video/quicktime';return 'video/mp4'}function isVideoUrl(url){return /\.(mp4|webm|mov)(\?|#|$)/i.test(String(url||''))}function renderHeroMedia(item,title){const src=getPortfolioCover(item);if(isVideoUrl(src)){return `<video class='detail-hero-media' src='${safeAttr(src)}' controls playsinline preload='metadata'><source src='${safeAttr(src)}' type='${guessVideoType(src)}'>Your browser does not support the video tag.</video>`}return `<img class='detail-hero-media' src='${safeAttr(src)}' alt='${safeAttr(title)}'>`}function renderMediaItem(item,index){const kind=item.kind||'image';const title=item.title||'';const caption=item.caption||'';const noteBlock=(title||caption)?`<div class='media-note'><strong>${safeText(title||'媒體說明')}</strong>${caption?`<p>${nl2br(caption)}</p>`:''}</div>`:'';if(kind==='video'){return `<figure class='card portfolio-media-item portfolio-media-item-video'><video class='detail-media-video' src='${safeAttr(item.url)}' controls playsinline preload='metadata'><source src='${safeAttr(item.url)}' type='${guessVideoType(item.url)}'>Your browser does not support the video tag.</video>${noteBlock}</figure>`}if(kind==='embed'){return `<figure class='card portfolio-media-item portfolio-media-item-embed'><div class='embed-wrap'>${item.embed_code||''}</div>${noteBlock}</figure>`}return `<figure class='card portfolio-media-item'><img class='detail-media-image' src='${safeAttr(item.url)}' alt='${safeAttr(item.alt||item.title||('media-'+index))}'>${noteBlock}</figure>`}const id=location.pathname.split('/').pop();fetchSite().then(data=>{const item=data.portfolio.find(x=>x.id===id);if(!item){document.getElementById('detail').innerHTML=`${nav()}<section class='page-hero container'><h1 class='section-title'>Not Found</h1><p class='section-subtitle'>The requested portfolio item does not exist.</p></section>${footer()}`;updateSeo({title:'Portfolio Not Found | CLM Studio',description:'The requested portfolio item does not exist.',path:location.pathname,noindex:true,structuredData:[getOrganizationJsonLd()]});return}const d=item[CURRENT_LANG];const schema=data.schema||{};const summaryText=getPortfolioSummary(item,CURRENT_LANG);const detailText=getPortfolioDetail(item,CURRENT_LANG);const seoTitle=buildPortfolioSeoTitle(item,CURRENT_LANG);const seoDescription=buildPortfolioSeoDescription(item,CURRENT_LANG);const media=(item.media||[]).length?item.media:[{kind:isVideoUrl(getPortfolioCover(item))?'video':'image',url:getPortfolioCover(item),title:d.title,caption:summaryText,alt:d.title,embed_code:''}];const detailHtml=nl2br(detailText);const summaryHtml=nl2br(summaryText);const primaryMedia=getPortfolioCover(item);const structured=[getOrganizationJsonLd(),buildBreadcrumbJsonLd([{name:CURRENT_LANG==='zh'?'首頁':'Home',path:'/'},{name:CURRENT_LANG==='zh'?'作品集':'Portfolio',path:'/portfolio'},{name:d.title,path:`/portfolio/${item.id}`}]),{"@context":"https://schema.org","@type":"CreativeWork","name":d.title,"headline":d.title,"description":seoDescription,"image":absoluteUrl(primaryMedia||''),"url":absoluteUrl(`/portfolio/${item.id}`),"keywords":(d.tech_stack||[]).join(', '),"inLanguage":CURRENT_LANG==='zh'?'zh-Hant':'en'}];if(schema.enable_video_object){const videoMedia=media.find(m=>m.kind==='video'&&m.url);if(videoMedia){structured.push({"@context":"https://schema.org","@type":"VideoObject","name":videoMedia.title||d.title,"description":videoMedia.caption||summaryText,"contentUrl":absoluteUrl(videoMedia.url),"thumbnailUrl":absoluteUrl(primaryMedia||''),"uploadDate":new Date().toISOString()})}}updateSeo({title:seoTitle,description:seoDescription,path:`/portfolio/${item.id}`,image:primaryMedia||'',type:'article',keywords:[item.category,...(d.tech_stack||[])],structuredData:structured.filter(Boolean)});document.getElementById('detail').innerHTML=`${nav()}<section class='page-hero container reveal'><div class='section-tag'>Case Study</div><h1 class='section-title'>${safeText(d.title)}</h1><p class='section-subtitle'>${summaryHtml}</p></section><section class='section container reveal'><div class='feature-split feature-split-detail'><div><div class='card portfolio-detail-main-card'>${renderHeroMedia(item,d.title)}<span class='pill'>${safeText(item.category)}</span><div class='tech-list'>${(d.tech_stack||[]).map(t=>`<span class='tech-tag'>${safeText(t)}</span>`).join('')}</div><div class='project-copy-block'><h3>${CURRENT_LANG==='zh'?'作品介紹':'Project Overview'}</h3><div class='project-copy'>${detailHtml}</div></div>${item.external_url&&isSafeContactHref(item.external_url)?`<div class='hero-actions'><a class='btn btn-primary' target='_blank' rel='noopener noreferrer' href='${safeHref(item.external_url)}'>${CURRENT_LANG==='zh'?'查看外部展示':'Open External Demo'}</a></div>`:''}<div class='hero-actions'><a class='btn btn-secondary' href='/portfolio'>${CURRENT_LANG==='zh'?'回作品集':'Back to Portfolio'}</a></div></div><div class='portfolio-media-list'>${media.map((m,i)=>renderMediaItem(m,i)).join('')}</div></div><div class='feature-list'><div class='feature-item'><strong>${CURRENT_LANG==='zh'?'專案類型':'Project Type'}</strong><span>${safeText(item.category)}</span></div><div class='feature-item'><strong>${CURRENT_LANG==='zh'?'技術堆疊':'Technology Stack'}</strong><span>${(d.tech_stack||[]).length?(d.tech_stack||[]).map(t=>safeText(t)).join(' · '):(CURRENT_LANG==='zh'?'尚未填寫':'Not filled yet')}</span></div><div class='feature-item'><strong>${CURRENT_LANG==='zh'?'作品摘要':'Project Summary'}</strong><span>${summaryHtml}</span></div><div class='feature-item'><strong>${CURRENT_LANG==='zh'?'展示媒體數量':'Media Count'}</strong><span>${media.length}</span></div></div></div></section>${footer()}`;if(window.mountReveal)mountReveal();});</script></body></html>
