<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SEO 檢查</title><link rel="stylesheet" href="/assets/styles.css"></head><body class="inner-page"><div id="app"></div><script src="/assets/shared.js"></script><script>fetchSite().then(async data=>{const seo=data.seo?.[CURRENT_LANG]||{};updateSeo({title:buildTitle('SEO 檢查'),description:'用來檢查 canonical、sitemap、robots、OG 與站點設定是否正確。',path:'/seo-check',noindex:true,structuredData:[getOrganizationJsonLd()]});const [robots,sitemap]=await Promise.all([fetch('/robots.txt').then(r=>r.text()),fetch('/sitemap.xml').then(r=>r.text())]);const canonical=document.querySelector('link[rel="canonical"]')?.href||'';const metaDesc=document.querySelector('meta[name="description"]')?.content||'';const ogUrl=document.querySelector('meta[property="og:url"]')?.content||'';const ogImage=document.querySelector('meta[property="og:image"]')?.content||'';document.getElementById('app').innerHTML=`${nav()}<section class='page-hero container'><div class='section-tag'>SEO Check</div><h1 class='section-title'>SEO / 網域檢查頁</h1><p class='section-subtitle'>這頁是給管理者確認目前 SEO 設定是否正確，不給搜尋引擎收錄。</p></section><section class='section container'><div class='grid-2'><article class='card'><h3>目前設定</h3><div class='table-list'><div class='mini-card'><strong>正式網域 site_url</strong><br>${data.seo?.site_url||'(未填)'}</div><div class='mini-card'><strong>Canonical</strong><br>${canonical}</div><div class='mini-card'><strong>Description</strong><br>${metaDesc}</div><div class='mini-card'><strong>OG URL</strong><br>${ogUrl}</div><div class='mini-card'><strong>OG Image</strong><br>${ogImage}</div></div></article><article class='card'><h3>怎麼判斷有沒有設定對</h3><div class='table-list'><div class='mini-card'>1. site_url 應該是正式網域，例如 https://yourdomain.com</div><div class='mini-card'>2. Canonical 與 OG URL 應該都要指向正式網域，不是 localhost</div><div class='mini-card'>3. Sitemap 裡面每個網址都要是正式網域</div><div class='mini-card'>4. robots.txt 要能看到 Sitemap 指向正式網域</div><div class='mini-card'>5. 作品頁應該有自己的 title / description / JSON-LD</div></div></article></div></section><section class='section container'><div class='grid-2'><article class='card'><h3>robots.txt</h3><pre style='white-space:pre-wrap;word-break:break-word'>${robots.replace(/[<>&]/g,m=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[m]))}</pre></article><article class='card'><h3>sitemap.xml</h3><pre style='white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto'>${sitemap.replace(/[<>&]/g,m=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[m]))}</pre></article></div></section>${footer()}`;});</script></body></html>
