<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Portfolio Detail</title><link rel="stylesheet" href="/assets/styles.css"></head><body class="inner-page"><div id="detail"></div><script src="/assets/shared.js"></script><script>const id=location.pathname.split('/').pop();fetchSite().then(data=>{const item=data.portfolio.find(x=>x.id===id);const d=item[CURRENT_LANG];document.getElementById('detail').innerHTML=`${nav()}<section class='page-hero container reveal'><div class='section-tag'>Case Study</div><h1 class='section-title'>${d.title}</h1><p class='section-subtitle'>${d.summary}</p></section><section class='section container reveal'><div class='feature-split'><div class='card'><img class='detail-cover' src='${item.cover_image}' alt='${d.title}'><span class='pill'>${item.category}</span><div class='tech-list'>${d.tech_stack.map(t=>`<span class='tech-tag'>${t}</span>`).join('')}</div><div style='margin-top:22px;line-height:1.95;color:#667085'>${d.detail}</div>${item.external_url?`<div class='hero-actions'><a class='btn btn-primary' target='_blank' rel='noopener noreferrer' href='${item.external_url}'>${CURRENT_LANG==='zh'?'查看外部展示':'Open External Demo'}</a></div>`:''}</div><div class='feature-list'><div class='feature-item'><strong>${CURRENT_LANG==='zh'?'專案類型':'Project Type'}</strong><span>${item.category}</span></div><div class='feature-item'><strong>${CURRENT_LANG==='zh'?'技術堆疊':'Technology Stack'}</strong><span>${d.tech_stack.join(' · ')}</span></div><div class='feature-item'><strong>${CURRENT_LANG==='zh'?'交付方式':'Delivery'}</strong><span>${CURRENT_LANG==='zh'?'獨立案例頁、媒體展示、可延伸後台管理。':'Dedicated case page, media presentation, and extendable admin management.'}</span></div><div class='hero-actions'><a class='btn btn-secondary' href='/portfolio'>${CURRENT_LANG==='zh'?'回作品集':'Back to Portfolio'}</a></div></div></div></section>${footer()}`;if(window.mountReveal)mountReveal();});</script></body></html>
